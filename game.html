  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--sand);
    color: var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    overflow-x:hidden;
  }
  .num{ font-family:'Fredoka', sans-serif; font-weight:600; letter-spacing:0.01em; }
  #app{ min-height:100vh; display:flex; flex-direction:column; position:relative; z-index:1; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background: var(--gold); color:#1a1a1a; }
  :focus-visible{ outline: 3px solid var(--coral); outline-offset: 2px; }

  /* ---------- Julia 森林場景背景 ---------- */
  .bg-scene{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image: var(--julia-bg);
    background-repeat:no-repeat;
    background-position:center center;
    background-size:cover;
  }
  /* 米色柔化層：讓插畫透出來，同時保證上面的文字對比夠 */
  .bg-veil{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background: linear-gradient(to bottom,
      rgba(251,246,236,0.66) 0%,
      rgba(251,246,236,0.40) 38%,
      rgba(251,246,236,0.46) 72%,
      rgba(251,246,236,0.62) 100%);
  }
  /* 手機直式：整張圖不裁切，縮成底部滿版，上緣柔化融進米色 */
  @media (max-aspect-ratio: 1/1){
    .bg-scene{
      top:auto; bottom:0; left:0; right:0;
      height:56.3vw;               /* 1672 x 941 的原始比例 */
      background-size:100% 100%;
      -webkit-mask-image:linear-gradient(to bottom, transparent 0%, #000 24%);
              mask-image:linear-gradient(to bottom, transparent 0%, #000 24%);
    }
    .bg-veil{ background: rgba(251,246,236,0.32); }
  }

  .mascot-bubble{ width:100px; height:100px; border-radius:50%; overflow:hidden; border:4px solid var(--cream); box-shadow:0 8px 20px rgba(46,36,24,0.22); flex:none; }
  .mascot-bubble img{ width:100%; height:100%; object-fit:cover; display:block; }
  .mascot-row{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .mascot-caption{ font-size:13px; color:var(--ink-dim); font-weight:700; }

  .shell{ flex:1; display:flex; flex-direction:column; align-items:center; padding: clamp(16px,4vw,40px); width:100%; }
  .col{ width:100%; max-width: 920px; margin:0 auto; display:flex; flex-direction:column; gap:16px; flex:1; }
  .center{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; flex:1; gap:16px; }

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; letter-spacing:0.14em; font-weight:700; text-transform:uppercase;
    color: var(--moss); border:1px dashed rgba(63,92,51,0.4); border-radius:999px; padding:6px 14px;
    background: rgba(127,178,122,0.12);
  }
  .marquee-title{
    font-family:'Fredoka', sans-serif; font-weight:600; letter-spacing:0.01em;
    font-size: clamp(34px, 6.6vw, 66px); line-height:1.08; color:var(--ink); margin:0;
  }
  .marquee-title .hl{ color:var(--coral); }
  .sub{ color: var(--ink-dim); font-size: clamp(14px,2vw,17px); line-height:1.55; margin:0; }

  .btn{
    border:none; border-radius:16px; padding:16px 26px; font-weight:800; font-size:17px;
    color:var(--cream); background:var(--moss); box-shadow: 0 6px 0 var(--moss-2);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:active{ transform: translateY(4px); box-shadow: 0 2px 0 var(--moss-2); }
  .btn.secondary{ background: var(--cream); color:var(--ink); border:1px solid var(--line); box-shadow:none; }
  .btn.secondary:active{ transform: translateY(2px); }
  .btn.ghost{ background:transparent; color:var(--ink-dim); box-shadow:none; border:1px solid var(--line); }
  .btn.block{ width:100%; }
  .btn.danger{ background:var(--alert); color:#fff; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  .role-pick{ display:grid; gap:16px; width:100%; max-width:560px; }
  @media(min-width:600px){ .role-pick{ grid-template-columns:1fr 1fr; } }
  .role-card{
    background:var(--cream); border:1px solid var(--line); border-radius:22px; padding:26px 20px;
    text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center;
  }
  .role-card .ic{ font-size:40px; }
  .role-card h3{ margin:0; font-size:19px; }
  .role-card p{ margin:0; color:var(--ink-dim); font-size:13.5px; line-height:1.5; }

  .panel{ background:var(--cream); border:1px solid var(--line); border-radius:22px; padding:22px; }
  .panel h2{ margin:0 0 4px; font-size:20px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12.5px; color:var(--ink-dim); font-weight:700; letter-spacing:.03em; }
  .field input, .field select, .field textarea{
    background:#fff; border:1px solid var(--line); border-radius:12px; color:var(--ink);
    padding:12px 14px; font-size:15px; font-family:inherit;
  }
  .field input:focus, .field select:focus{ border-color: var(--coral); }
  .stack{ display:flex; flex-direction:column; gap:10px; }

  .topbar{
    width:100%; max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding: 4px 4px 0; flex-wrap:wrap;
  }
  .chip{
    display:flex; align-items:center; gap:8px; background:var(--cream); border:1px solid var(--line);
    border-radius:999px; padding:8px 16px; font-size:14px; font-weight:700; color:var(--ink);
  }
  .chip .num{ font-size:22px; line-height:1; }
  .chip.timer{ min-width:84px; justify-content:center; }
  .chip.timer.urgent{ background: rgba(217,83,79,0.15); border-color: var(--alert); color:#a83a36; animation: pulse 1s infinite; }
  .chip.shouxing{ background: rgba(232,101,75,0.14); border-color:var(--coral); color:#9e3a27; }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }

  .q-header-img{ max-width:100%; max-height:240px; object-fit:contain; border-radius:16px; margin:0 auto 4px; display:block; }
  .qtext{
    font-size: clamp(21px, 4.2vw, 34px); font-weight:900; line-height:1.38; text-align:center;
    margin: 6px 0 4px; padding: 0 6px;
    white-space: pre-wrap;        /* honour the line breaks the host typed */
    overflow-wrap: anywhere;
    max-width: 20em; margin-inline: auto;   /* stop long lines running the full width */
  }
  /* Long questions step down a size so they still fit on the projector. */
  .qtext.long{ font-size: clamp(18px, 3.1vw, 26px); line-height:1.45; max-width:24em; }
  .qtext.xlong{ font-size: clamp(16px, 2.5vw, 21px); line-height:1.5; max-width:28em; }
  .options-grid{ display:grid; grid-template-columns:1fr; gap:14px; width:100%; max-width:1000px; margin:0 auto; }
  @media(min-width:760px){ .options-grid{ grid-template-columns:1fr 1fr; } }
  /* Long text answers: a half-width 2-col card wraps them awkwardly, so force a
     single full-width column (top-to-bottom) regardless of screen size — two
     classes beats the plain .options-grid rule above no matter which comes
     later in the stylesheet, so this always wins once optionsGridClass() adds it. */
  .options-grid.stacked{ grid-template-columns:1fr; }
  /* Image options: on screens wide enough to fit four cards side by side
     (projector/laptop, not a phone) put all four photos in one row instead of
     2x2. That frees the vertical space the second row used to take, so
     .opt-img can grow into it — this is the actual size win, not the row
     count by itself (see the comment on optionsGridClass()). */
  @media(min-width:900px){
    .options-grid.img-row{ grid-template-columns:repeat(4,1fr); gap:12px; max-width:1400px; }
    .options-grid.img-row .opt-img{ height:clamp(170px, 26vh, 340px); }
  }

  .opt-card{
    position:relative; border:none; border-radius:18px; padding:20px; text-align:left; display:flex; align-items:center; gap:14px;
    font-size: clamp(15px,2.2vw,19px); font-weight:800; color:var(--ink); box-shadow:0 6px 0 rgba(46,36,24,0.16);
    transition: transform .07s ease, box-shadow .07s ease, filter .15s ease; width:100%;
  }
  .opt-card:active{ transform: translateY(4px); box-shadow:0 2px 0 rgba(46,36,24,0.16); }
  .opt-card .tag{
    flex:none; width:34px; height:34px; border-radius:10px; background:rgba(46,36,24,0.14);
    display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; font-size:18px; font-weight:700;
  }
  .opt-card .tag.corner{ position:absolute; top:12px; left:12px; z-index:2; box-shadow:0 2px 4px rgba(0,0,0,.2); background:rgba(255,255,255,0.85); }
  .opt-a{ background:var(--gold); } .opt-b{ background:var(--leaf); }
  .opt-c{ background:var(--terracotta); } .opt-d{ background:var(--sky); }
  .opt-card.has-img{ flex-direction:column; align-items:stretch; padding:10px; gap:8px; }
  /* object-fit:contain (not cover) so the whole uploaded photo is always visible —
     any letterboxing shows the option's own colour (gold/leaf/terracotta/sky)
     through the padding, so it still looks like a deliberate frame, not a bug. */
  .opt-img{ width:100%; height:170px; object-fit:contain; border-radius:12px; display:block; }
  .opt-cap{ font-size:14px; font-weight:800; text-align:center; }
  .opt-card.dim{ filter:grayscale(.35) brightness(.92); opacity:.7; }
  .opt-card.shouxing-glow{ outline:4px solid var(--coral); box-shadow:0 0 0 6px rgba(232,101,75,0.22); }
  .opt-card:disabled{ cursor:default; }

  .progress-wrap{ width:100%; max-width:1000px; margin:6px auto 0; }
  .progress-track{ background:var(--sand-2); border-radius:999px; height:12px; overflow:hidden; border:1px solid var(--line); }
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--leaf), var(--gold)); transition:width .3s ease; }
  .progress-label{ text-align:center; font-size:13px; color:var(--ink-dim); margin-top:6px; }

  .qr-card{
    background:#fff; border-radius:20px; display:inline-flex; max-width:100%;
    padding: clamp(10px, 1.4vmin, 16px);
    box-shadow:0 8px 20px rgba(46,36,24,0.12);
  }
  /* Sized in vmin so the code tracks the SHORTER side of the screen: it can't
     overflow a narrow phone sideways, and it can't run off the bottom of a
     short/4:3 projector. The clamp floor keeps it scannable on tiny screens. */
  .qr-holder{
    width: clamp(168px, 36vmin, 380px);
    height: clamp(168px, 36vmin, 380px);
  }
  .qr-holder.sm{
    width: clamp(140px, 18vmin, 180px);
    height: clamp(140px, 18vmin, 180px);
  }
  .join-url{ font-size:13px; color:var(--ink-dim); word-break:break-all; text-align:center; }
  .players-grid{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:6px 0; }
  .player-pill{
    background:var(--cream); border:1px solid var(--line); border-radius:999px; padding:9px 16px;
    font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; color:var(--ink);
  }
  .player-pill.is-shouxing{ background:rgba(232,101,75,0.14); border-color:var(--coral); }
  .player-pill .dot{ width:8px; height:8px; border-radius:50%; background:var(--leaf); }
  .badge-shouxing{ display:inline-flex; background:var(--coral); color:#fff; font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; margin-left:6px; white-space:nowrap; }

  .lb-row{
    display:flex; align-items:center; gap:14px; background:var(--cream); border:1px solid var(--line);
    border-radius:16px; padding:14px 18px;
  }
  .lb-row.me{ border-color: var(--coral); background: rgba(232,101,75,0.08); }
  .lb-rank{ font-family:'Fredoka',sans-serif; font-size:24px; width:34px; text-align:center; color:var(--ink-dim); }
  .lb-rank.top1{ color:var(--gold); font-size:30px; } .lb-rank.top2{ color:#9a9a9a; font-size:27px; } .lb-rank.top3{ color:var(--terracotta); font-size:27px; }
  .lb-name{ flex:1; font-weight:800; font-size:16px; display:flex; align-items:center; flex-wrap:wrap; }
  .lb-score{ font-family:'Fredoka',sans-serif; font-size:26px; color:var(--moss); }
  .lb-delta{ font-size:12px; color:var(--leaf); font-weight:700; background:rgba(127,178,122,0.18); padding:2px 8px; border-radius:999px; }

  .podium{ display:flex; align-items:flex-end; gap:12px; justify-content:center; width:100%; max-width:640px; margin:10px auto; }
  .podium .p{ flex:1; background:var(--cream); border:1px solid var(--line); border-radius:16px 16px 0 0; padding:14px 8px 16px; text-align:center; }
  .podium .p.first{ order:2; padding-top:26px; border-top:3px solid var(--gold); }
  .podium .p.second{ order:1; border-top:3px solid #b9b9b9; }
  .podium .p.third{ order:3; border-top:3px solid var(--terracotta); }
  .podium .medal{ font-size:30px; }
  .podium .name{ font-weight:800; font-size:14px; margin-top:4px; }
  .podium .score{ font-family:'Fredoka',sans-serif; font-size:24px; color:var(--moss); }
  /* Awards podium: each rank fades/rises into place in sequence (3rd, 2nd, 1st)
     instead of the whole board just appearing at once. */
  .podium .p.reveal{ opacity:0; transform:translateY(26px) scale(.94); transition:opacity .5s ease, transform .5s ease; }
  .podium .p.reveal.show{ opacity:1; transform:translateY(0) scale(1); }

  /* ---------- 頭像選擇 ---------- */
  .avatar-grid{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .avatar-btn{
    width:46px; height:46px; border-radius:14px; font-size:24px; line-height:1;
    background:#fff; border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
  }
  .avatar-btn.sel{ border-color:var(--coral); background:rgba(232,101,75,0.12); }
  .avatar-badge{ display:inline-block; margin-right:6px; font-size:1.1em; }

  /* ---------- 猜拳抽籤 ---------- */
  .rps-hand{ font-size:20px; margin-left:6px; }

  /* ---------- 作答紀錄 ---------- */
  .answerlog-row{ text-align:left; }
  .answerlog-row.ok{ border-color: var(--leaf); }
  .answerlog-row.no{ opacity:.88; }

  .qlist{ display:flex; flex-direction:column; gap:10px; }
  .qrow{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:flex; gap:12px; align-items:flex-start; }
  .qrow.editing{ border-color:var(--moss); box-shadow:0 0 0 3px rgba(63,92,51,0.14); }
  .qrow .qi{ font-family:'Fredoka',sans-serif; font-size:20px; color:var(--ink-dim); width:26px; flex:none; }
  .qrow .qb{ flex:1; min-width:0; }
  .qrow .qb .qt{ font-weight:700; font-size:14.5px; margin-bottom:6px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .qrow .qb .oo{ font-size:12.5px; color:var(--ink-dim); }
  .qrow .del{ flex:none; background:none; border:none; color:var(--alert); font-size:13px; font-weight:700; padding:4px 8px; }
  .qrow .edit{ flex:none; background:none; border:none; color:var(--moss); font-size:13px; font-weight:700; padding:4px 8px; }
  .qrow .preview{ flex:none; background:none; border:none; color:var(--coral); font-size:13px; font-weight:700; padding:4px 8px; }
  .qrow .qactions{ flex:none; display:flex; flex-direction:column; }

  .waiting-dots span{ animation: blink 1.4s infinite; opacity:.25; }
  .waiting-dots span:nth-child(2){ animation-delay:.2s; } .waiting-dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

  .confetti-piece{ position:fixed; top:-24px; font-size:22px; animation: fall linear forwards; pointer-events:none; z-index:5; }
  @keyframes fall{ to{ transform: translateY(108vh) rotate(360deg); opacity:0.9; } }

  .checkbox-row{ display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .checkbox-row input{ width:18px; height:18px; }
  .checkbox-row label{ font-size:14px; font-weight:700; color:var(--ink); }

  /* ---------- 主持人導覽列 ---------- */
  .host-nav{ display:flex; gap:8px; flex-wrap:wrap; width:100%; }
  .navbtn{
    background:rgba(251,246,236,0.78); border:1px solid var(--line); border-radius:999px;
    padding:6px 13px; font-size:12.5px; font-weight:700; color:var(--ink-dim); font-family:inherit; cursor:pointer;
  }
  .navbtn:hover{ color:var(--ink); background:var(--cream); }

  /* ---------- 題庫列 ---------- */
  .bankrow{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .bankrow .bb{ flex:1; min-width:150px; }
  .bankrow .bt{ font-weight:800; font-size:14.5px; }
  .bankrow .bm{ font-size:12px; color:var(--ink-dim); margin-top:3px; }
  .minibtn{
    background:var(--cream); border:1px solid var(--line); border-radius:10px; padding:7px 11px;
    font-size:12.5px; font-weight:800; color:var(--ink); font-family:inherit; cursor:pointer; white-space:nowrap;
  }
  .minibtn.warn{ color:var(--alert); border-color:rgba(217,83,79,0.35); }
  .minibtn:hover{ background:#fff; }

  /* ---------- 自製確認視窗（不用瀏覽器的 confirm，投影出來比較好看） ---------- */
  .modal-backdrop{
    position:fixed; inset:0; z-index:20; background:rgba(46,36,24,0.42);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background:var(--cream); border-radius:22px; padding:24px; max-width:420px; width:100%;
    box-shadow:0 18px 44px rgba(46,36,24,0.3); text-align:center;
  }
  .modal-box h3{ margin:0 0 8px; font-size:19px; }
  .modal-box p{ margin:0 0 18px; font-size:14px; line-height:1.6; color:var(--ink-dim); }

  @media (prefers-reduced-motion: reduce){
    .chip.timer.urgent{ animation:none; }
    .confetti-piece{ animation:none; display:none; }
    .btn, .opt-card{ transition:none; }
  }
</style>
</head>

/* Fisher-Yates on a copy — never mutates the caller's array */
function shuffled(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function fmtWhen(ts){
  if (!ts) return '';
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* In-page confirm/prompt — nicer on a projector than the browser's own dialogs,
   and it never blocks the page the way alert()/confirm() do. */
let _modalResolve = null;
function uiConfirm(title, message, okLabel, danger){
  return new Promise(resolve => {
    _modalResolve = resolve;
    const el = document.createElement('div');
    el.className = 'modal-backdrop';
    el.id = 'ui-modal';
    el.innerHTML = `
      <div class="modal-box">
        <h3>${esc(title)}</h3>
        <p>${esc(message)}</p>
        <div class="btn-row">
          <button class="btn secondary" onclick="closeModal(false)">取消</button>
          <button class="btn ${danger?'danger':''}" onclick="closeModal(true)">${esc(okLabel || '確定')}</button>
        </div>
      </div>`;
    el.addEventListener('click', e => { if (e.target === el) closeModal(false); });
    document.body.appendChild(el);
  });
}
function closeModal(result){
  const el = document.getElementById('ui-modal');
  if (el) el.remove();
  if (_modalResolve){ const r = _modalResolve; _modalResolve = null; r(result); }
}
function toast(msg){

    + 'font-weight:800;font-size:14px;box-shadow:0 8px 20px rgba(46,36,24,.28)';

/* sizeClass: '' for the big lobby code, 'sm' for the 壽星 panel — the actual
   pixel size comes from CSS so it adapts to the screen. */
function qrSvgHtml(url, sizeClass){
  const cls = 'qr-holder' + (sizeClass ? ' ' + sizeClass : '');
  try{
    let qr = null, lastErr = null;
    for (let tn = 1; tn <= 40; tn++){
      try{
        qr = qrcode(tn, 'M');
        qr.addData(url);
        qr.make();
        break;
      } catch(e){ lastErr = e; qr = null; }
    }
    if (!qr) throw lastErr || new Error('QR generation failed');

    let svg = qr.createSvgTag(4, 16);
    // The library emits <svg width="164px" height="164px"> with NO viewBox, so
    // CSS sizing moved the canvas without scaling the drawing: the code sat in
    // the top-left at its natural size, and in the smaller 壽星 panel it was
    // clipped outright — which is exactly how a QR stops scanning. Give it a
    // viewBox so it scales to whatever box we put it in, and paint the quiet
    // zone white so the code keeps its contrast whatever sits behind it.
    const n = parseInt((svg.match(/width="(\d+)px"/) || [])[1], 10);
    if (!n) throw new Error('unexpected QR svg');
    svg = svg.replace(/^<svg[^>]*>/,
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}"`
      + ` preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges"`
      + ` style="width:100%;height:100%;display:block">`
      + `<rect x="0" y="0" width="${n}" height="${n}" fill="#ffffff"/>`);

    return `<div class="${cls}">${svg}</div>`;
  } catch(e){
    console.error('QR generation failed', e);
    return `<div class="${cls}" style="display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-dim);text-align:center;padding:8px;background:#fff">QR 產生失敗<br>請用下方連結加入</div>`;
  }
}

function optionCardHtml(opt, i, onclickAttr){
  const hasImg = !!opt.img;
  const cls = 'opt-card ' + OPT_CLASS[i] + (hasImg? ' has-img':'');
  const tagCls = hasImg ? 'tag corner' : 'tag';
  const inner = hasImg
    ? `<span class="${tagCls}">${OPT_LABEL[i]}</span><img class="opt-img" src="${opt.img}" alt="">${opt.label? `<span class="opt-cap">${esc(opt.label)}</span>`:''}`
    : `<span class="${tagCls}">${OPT_LABEL[i]}</span><span>${esc(opt.label)}</span>`;
  if (onclickAttr){
    return `<button class="${cls}" ${onclickAttr}>${inner}</button>`;
  }
  return `<div class="${cls}">${inner}</div>`;
}
/* Picks the layout for the options-grid wrapping four optionCardHtml() cards.
   - Image options: on wide-enough screens (projector / laptop, not a phone)
     put all four photos in a single row instead of 2x2. A single row frees up
     the vertical space the second row used to take, and .options-grid.img-row
     reinvests exactly that freed space into a taller .opt-img (see CSS), so
     the photos actually get bigger instead of just rearranging.
   - Text options: normally stay 2x2 on wide screens same as before. But once
     an answer is long enough that a half-width 2-col card would wrap it
     awkwardly, force a single full-width column instead (top-to-bottom) so
     every answer gets the full row to lay out on as few lines as possible. */
function optionsGridClass(q){
  if (!q || !Array.isArray(q.options)) return 'options-grid';
  if (q.type === 'image') return 'options-grid img-row';
  const LONG_LABEL_CHARS = 12; // ~ one comfortable line at the largest option font size in a 2-col card
  const hasLongLabel = q.options.some(o => (o && o.label || '').length > LONG_LABEL_CHARS);
  return 'options-grid' + (hasLongLabel ? ' stacked' : '');
}
function revealRowHtml(opt, i, count, isShouxingPick){

  return `

      <span class="tag">${OPT_LABEL[i]}</span>
      ${thumb}
      <span style="flex:1">${esc(opt.label||'')}</span>
      <span class="num" style="font-size:20px">${count}</span>
    </div>
  `;
}
/* A 壽星 who isn't on the player list any more (they never came back after a
   name-list wipe, or the badge was left over from a test run) must not count.
   Otherwise the host could start a round with a phantom 壽星, and since nobody
   would ever submit "the" answer, every question would score zero for everyone. */
function dropMissingShouxing(state){
  if (state && state.shouxingId && !(state.players || {})[state.shouxingId]){
    state.shouxingId = null;
    return true;
  }
  return false;
}
/* Everyone except the 壽星, best score first. */
function rankedGuessers(players, shouxingId){
  return Object.entries(players || {})
    .filter(([id]) => id !== shouxingId)
    .sort((a,b) => b[1].score - a[1].score);
}
/* Estimate how many lines the question will occupy — the box is about 20
   characters wide at full size — and step the type down only once it would
   start crowding the screen. Counting lines rather than raw characters means a
   question the host split with Enter keeps its big, projector-friendly size. */
function qtextHtml(text, extraStyle){
  const lines = String(text == null ? '' : text).split('\n');
  const est = lines.reduce((n, line) => n + Math.max(1, Math.ceil(line.length / 20)), 0);
  const cls = 'qtext' + (est > 5 ? ' xlong' : est > 3 ? ' long' : '');
  return `<div class="${cls}"${extraStyle ? ` style="${extraStyle}"` : ''}>${esc(text)}</div>`;
}

}

/* ---------- client-side image compression (for question authoring) ---------- */
function fileToCompressedDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h){ if (w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if (h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('image decode failed'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

/* The host page is gated by a secret key that server.py prints in the terminal.
   The key never leaves the server — we only ever ask it yes/no. */
async function verifyHostKey(k){
  if (!k) return false;
  try{
    const r = await fetch('/api/host/check?key=' + encodeURIComponent(k));
    if (!r.ok) return false;
    const d = await r.json();
    return !!d.ok;
  } catch(e){ return false; }
}
function rememberHostKey(k){ try{ localStorage.setItem(HOST_KEY_LS, k); }catch(e){} }
function forgetHostKey(){ try{ localStorage.removeItem(HOST_KEY_LS); }catch(e){} }

async function boot(){
  const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
  const j = hashParams.get('join');
  const hk = hashParams.get('host');
  const pv = hashParams.get('preview');

  if (j === '1' || j === 'star'){
    ROLE = 'player';
    IS_STAR_LINK = (j === 'star');
    renderPlayerNameEntry();
    return;
  }

  // Standalone question preview — opened in an iframe or new tab from the setup
  // page's 👁 預覽 button. Reads the saved draft straight from storage (already
  // world-readable, same as banks) so it needs no host-key check of its own; it
  // never joins the game or starts any polling, just renders the one question.
  if (pv !== null){
    ROLE = 'preview';
    await bootPreview(parseInt(pv, 10), hashParams.get('as') || 'host');
    return;
  }

  render(`<div class="shell"><div class="center"><p class="sub">載入中…</p></div></div>`);

  if (hk){
    if (await verifyHostKey(hk)){
      HOST_UNLOCKED = true; HOST_KEY = hk; rememberHostKey(hk);
      chooseHost();
    } else {
      renderHostDenied();
    }
    return;
  }

  // This browser may have been unlocked earlier — re-check, in case the key changed.
  let saved = null;
  try{ saved = localStorage.getItem(HOST_KEY_LS); }catch(e){}
  if (saved){
    if (await verifyHostKey(saved)){ HOST_UNLOCKED = true; HOST_KEY = saved; }
    else forgetHostKey();
  }
  renderRoleSelect();
}

      if (Array.isArray(draft.prizes) && draft.prizes.length===3) PRIZES = draft.prizes;

  renderHostSetup();

      prizes: PRIZES

async function refreshBanks(){
  try{
    const keys = await sList('bank:');
    const rows = [];
    for (const k of keys){
      const b = await sGet(k);
      if (!b || !Array.isArray(b.questions)) continue;
      rows.push({ key:k, id:b.id, name:b.name || '未命名題庫', count:b.questions.length, updatedAt:b.updatedAt || 0 });
    }
    rows.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
    BANKS = rows;
  } catch(e){ console.error('bank list failed', e); BANKS = []; }
}
function bankPayload(name, id){
  return {
    id: id || ('b_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6)),
    name,
    updatedAt: Date.now(),
    timeLimitSeconds: TIME_LIMIT_SECONDS,
    questions: QUESTIONS
  };
}
async function saveBankAsNew(){
  if (!QUESTIONS.length){ toast('目前沒有題目可以存'); return; }
  const input = document.getElementById('bank-name');
  const name = (input && input.value.trim()) || ('題庫 ' + fmtWhen(Date.now()));
  const payload = bankPayload(name);
  await sSet('bank:' + payload.id, payload);
  if (input) input.value = '';
  await refreshBanks();
  renderHostSetup();
  toast('已存成「' + name + '」');
}
async function overwriteBank(i){
  const row = BANKS[i]; if (!row) return;
  const { key, name } = row;
  if (!QUESTIONS.length){ toast('目前沒有題目可以存'); return; }
  const ok = await uiConfirm('覆蓋「' + name + '」？',
    '這個題庫裡原本的題目會被目前編輯中的 ' + QUESTIONS.length + ' 題整批取代，無法復原。',
    '覆蓋', true);
  if (!ok) return;
  const old = await sGet(key);
  const payload = bankPayload(name, old ? old.id : null);
  await sSet(key, payload);
  await refreshBanks();
  renderHostSetup();
  toast('已覆蓋「' + name + '」');
}
async function loadBank(i, append){
  const row = BANKS[i]; if (!row) return;
  const { key, name } = row;
  const bank = await sGet(key);
  if (!bank || !Array.isArray(bank.questions)){ toast('讀取失敗'); return; }
  if (!append && QUESTIONS.length){
    const ok = await uiConfirm('載入「' + name + '」？',
      '目前編輯中的 ' + QUESTIONS.length + ' 題會被取代。如果還想留著，請先存成新題庫。',
      '取代並載入', true);
    if (!ok) return;
  }
  QUESTIONS = append ? QUESTIONS.concat(bank.questions) : bank.questions.slice();
  if (!append && bank.timeLimitSeconds) TIME_LIMIT_SECONDS = bank.timeLimitSeconds;
  if (DRAW_COUNT > QUESTIONS.length) DRAW_COUNT = 0;
  await saveDraft();
  renderHostSetup();
  toast(append ? ('已追加 ' + bank.questions.length + ' 題') : ('已載入 ' + bank.questions.length + ' 題'));
}
async function renameBank(i){
  const row = BANKS[i]; if (!row) return;
  const { key, name: oldName } = row;
  const input = document.getElementById('bank-name');
  const newName = input ? input.value.trim() : '';
  if (!newName){ toast('請先在上面的欄位輸入新名稱'); return; }
  const bank = await sGet(key);
  if (!bank) return;
  bank.name = newName;
  bank.updatedAt = Date.now();
  await sSet(key, bank);
  if (input) input.value = '';
  await refreshBanks();
  renderHostSetup();
  toast('「' + oldName + '」已改名為「' + newName + '」');
}
async function deleteBank(i){
  const row = BANKS[i]; if (!row) return;
  const { key, name } = row;
  const ok = await uiConfirm('刪除「' + name + '」？', '這個題庫會永久消失，無法復原。', '刪除', true);
  if (!ok) return;
  await sDel(key);
  await refreshBanks();
  renderHostSetup();
  toast('已刪除「' + name + '」');
}
async function exportBanks(){
  if (!BANKS.length){ toast('還沒有存過任何題庫'); return; }
  const banks = [];
  for (const b of BANKS){
    const full = await sGet(b.key);
    if (full) banks.push(full);
  }
  const blob = new Blob([JSON.stringify({ app:'julia-party-quiz', version:1, exportedAt:Date.now(), banks }, null, 2)],
                        { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'julia題庫_' + fmtWhen(Date.now()).replace(/[\/ :]/g,'') + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('已匯出 ' + banks.length + ' 個題庫');
}
async function importBanksFile(input){
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  let data;
  try{
    data = JSON.parse(await file.text());
  } catch(e){ toast('這個檔案不是有效的題庫檔'); return; }
  const incoming = Array.isArray(data) ? data : (data && Array.isArray(data.banks) ? data.banks : null);
  if (!incoming || !incoming.length){ toast('檔案裡沒有題庫資料'); return; }

  const existingNames = new Set(BANKS.map(b=>b.name));
  let added = 0;
  for (const b of incoming){
    if (!b || !Array.isArray(b.questions) || !b.questions.length) continue;
    let name = b.name || '匯入的題庫';
    if (existingNames.has(name)) name = name + '（匯入）';
    while (existingNames.has(name)) name = name + '＋';
    existingNames.add(name);
    const id = 'b_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    await sSet('bank:' + id, {
      id, name, updatedAt: Date.now(),
      timeLimitSeconds: Number(b.timeLimitSeconds) || 15,
      questions: b.questions
    });
    added++;
  }
  await refreshBanks();
  renderHostSetup();
  toast(added ? ('已匯入 ' + added + ' 個題庫') : '沒有可匯入的題庫');
}

/* ---------- 出題方式（隨機設定） ---------- */
function toggleRandomOrder(el){ RANDOM_ORDER = el.checked; saveDraft(); updateDrawHint(); }
function toggleRandomOptions(el){ RANDOM_OPTIONS = el.checked; saveDraft(); }
function setDrawCount(el){
  let v = parseInt(el.value, 10);
  if (isNaN(v) || v < 0) v = 0;
  if (v > QUESTIONS.length) v = QUESTIONS.length;
  DRAW_COUNT = v;
  el.value = v ? String(v) : '';
  saveDraft();
  updateDrawHint();
}
function drawHintText(){
  const total = QUESTIONS.length;
  const n = (DRAW_COUNT > 0 && DRAW_COUNT < total) ? DRAW_COUNT : total;
  if (!total) return '還沒有題目。';
  let s = `這一場會出 ${n} 題`;
  if (n < total) s += `（從 ${total} 題裡隨機抽）`;
  if (RANDOM_ORDER) s += '，順序隨機';
  if (RANDOM_OPTIONS) s += '，選項也隨機';
  return s + '。';
}
function updateDrawHint(){
  const el = document.getElementById('draw-hint');
  if (el) el.textContent = drawHintText();
}
/* Build the list actually played this round, leaving the master QUESTIONS untouched. */
function buildPlayList(){
  const total = QUESTIONS.length;
  const drawing = DRAW_COUNT > 0 && DRAW_COUNT < total;
  let list;
  if (drawing){
    const picked = shuffled(QUESTIONS).slice(0, DRAW_COUNT);
    // If the host didn't ask for random order, show the drawn subset in its original order.
    list = RANDOM_ORDER ? picked : QUESTIONS.filter(q => picked.includes(q));
  } else {
    list = RANDOM_ORDER ? shuffled(QUESTIONS) : QUESTIONS.slice();
  }
  if (RANDOM_OPTIONS){
    list = list.map(q => Object.assign({}, q, { options: shuffled(q.options) }));
  }
  return list;
}

/* Update the buttons in place rather than re-rendering — a full re-render would
   wipe whatever the host has half-typed into the 新增題目 form below. */
function setTimeLimit(s){
  TIME_LIMIT_SECONDS = s;
  const row = document.getElementById('time-row');
  if (row){
    row.querySelectorAll('button').forEach(b=>{
      b.className = 'btn' + (Number(b.dataset.secs) === s ? '' : ' secondary');
    });
  } else {
    renderHostSetup();
  }
  saveDraft();
}
function deleteQuestion(i){
  QUESTIONS.splice(i,1);
  if (DRAW_COUNT > QUESTIONS.length) DRAW_COUNT = 0;
  // Keep the edit form pointed at the right question if the list shifted under it.
  if (editingQuestionIndex === i) editingQuestionIndex = null;
  else if (editingQuestionIndex != null && editingQuestionIndex > i) editingQuestionIndex -= 1;
  renderHostSetup();
  saveDraft();
}
/* Load an existing question back into the 新增題目 form so it can be edited in
   place, rather than deleting + retyping it from scratch. */
function editQuestion(i){
  editingQuestionIndex = i;
  renderHostSetup();
  const panel = document.getElementById('add-q-panel');

/* 👁 題目預覽 — lets the host check what a question actually looks like without
   needing anyone else online: no lobby, no 壽星, no polling. Built as its own
   modal (appended straight to <body>, outside the #app render() cycle) so it
   survives whatever else is happening on the setup page underneath it.
   The preview itself is a REAL nested page load (an <iframe> pointed at
   #preview=<i>&as=host|player) rather than a re-implementation of the question
   markup — that's the only way the phone-sized frame gets the same vw-relative
   font sizing a real phone would, and it can never silently drift out of sync
   with how the question actually renders in the live game. */
function openQuestionPreview(i, mode){
  mode = mode || 'host';
  closeQuestionPreview();
  const el = document.createElement('div');
  el.className = 'modal-backdrop';
  el.id = 'preview-modal';
  el.innerHTML = `
    <div class="modal-box" style="max-width:640px;width:100%">
      <h3 style="text-align:center">👁 第 ${i+1} 題預覽</h3>
      <p class="sub" style="text-align:center;margin-bottom:10px">只是預覽，選項點了不會送出答案</p>
      <div class="btn-row" id="preview-mode-row" style="margin-bottom:12px">
        <button class="btn${mode==='host'?'':' secondary'}" data-mode="host" onclick="switchPreviewMode(${i},'host')">🖥️ 主畫面（投影）</button>
        <button class="btn${mode==='player'?'':' secondary'}" data-mode="player" onclick="switchPreviewMode(${i},'player')">📱 玩家手機</button>
      </div>
      <div id="preview-frame-wrap" style="display:flex;justify-content:center"></div>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn ghost" onclick="window.open(baseUrl()+'#preview=${i}&as='+currentPreviewMode,'_blank')">🔗 開新分頁看大螢幕</button>
        <button class="btn secondary" onclick="closeQuestionPreview()">關閉</button>
      </div>
    </div>`;
  el.addEventListener('click', e => { if (e.target === el) closeQuestionPreview(); });
  document.body.appendChild(el);
  switchPreviewMode(i, mode);
}
let currentPreviewMode = 'host';
function switchPreviewMode(i, mode){
  currentPreviewMode = mode;
  const wrap = document.getElementById('preview-frame-wrap');
  if (!wrap) return;
  const iframe = document.createElement('iframe');
  iframe.src = baseUrl() + '#preview=' + i + '&as=' + mode;
  iframe.style.border = '1px solid var(--line)';
  iframe.style.borderRadius = '18px';
  iframe.style.background = '#fff';
  if (mode === 'player'){
    iframe.style.width = '360px';
    iframe.style.height = '680px';
    iframe.style.maxWidth = '100%';
  } else {
    iframe.style.width = '100%';
    iframe.style.maxWidth = '580px';
    iframe.style.height = '440px';
  }
  wrap.innerHTML = '';
  wrap.appendChild(iframe);
  const row = document.getElementById('preview-mode-row');
  if (row){
    row.querySelectorAll('button').forEach(b=>{
      b.className = 'btn' + (b.dataset.mode === mode ? '' : ' secondary');
    });
  }
}
function closeQuestionPreview(){
  const el = document.getElementById('preview-modal');
  if (el) el.remove();
}

/* Adds a new question, or — when editingQuestionIndex is set — saves changes back
   into that slot in place. A file input left empty while editing keeps whatever
   image (header or per-option) that question already had; it's only replaced if
   the host actually chooses a new file. */
async function saveQuestionFromForm(){
  const isEdit = editingQuestionIndex != null && QUESTIONS[editingQuestionIndex];
  const existing = isEdit ? QUESTIONS[editingQuestionIndex] : null;
  const text = document.getElementById('nq-text').value.trim();
  if (!text){ alert('請輸入題目文字'); return; }
  const type = document.getElementById('nq-type').value;
  const btn = document.getElementById('nq-submit-btn');
  const btnLabel = isEdit ? '💾 儲存這題' : '➕ 新增這題';
  btn.disabled = true; btn.textContent = '處理圖片中…';
  try{
    let headerImg = existing ? existing.headerImg : null;
    const headerFile = document.getElementById('nq-header-img').files[0];
    if (headerFile) headerImg = await fileToCompressedDataUrl(headerFile, 800, 0.7);
    else {
      const removeCb = document.getElementById('nq-header-img-remove');
      if (removeCb && removeCb.checked) headerImg = null;
    }

    let options;
    if (type === 'text'){
      const vals = [0,1,2,3].map(i=> document.getElementById('nq-t-'+i).value.trim());
      if (vals.some(v=>!v)){ alert('請把四個文字選項都填寫完整'); btn.disabled=false; btn.textContent=btnLabel; return; }
      options = vals.map(v=> ({ label:v, img:null }));
    } else {
      const files = [0,1,2,3].map(i=> document.getElementById('nq-img-'+i).files[0]);
      const existingOpts = (isEdit && existing.type === 'image') ? existing.options : null;
      if (files.some((f,i)=> !f && !(existingOpts && existingOpts[i] && existingOpts[i].img))){
        alert('請上傳四張圖片（沒換新圖的維持原本的圖也可以）'); btn.disabled=false; btn.textContent=btnLabel; return;
      }
      const caps = [0,1,2,3].map(i=> document.getElementById('nq-cap-'+i).value.trim());
      options = [];
      for (let i=0;i<4;i++){
        const img = files[i] ? await fileToCompressedDataUrl(files[i], 640, 0.68) : existingOpts[i].img;
        options.push({ label: caps[i] || '', img });
      }
    }
    if (isEdit) QUESTIONS[editingQuestionIndex] = { text, type, headerImg, options };
    else QUESTIONS.push({ text, type, headerImg, options });
    editingQuestionIndex = null;
    renderHostSetup();
    saveDraft();
  } catch(e){
    console.error(e);
    alert('圖片處理失敗，請再試一次');
    btn.disabled = false; btn.textContent = btnLabel;
  }
}

/* ============================================================
   HOST: LOBBY
   ============================================================ */
async function startLobby(){
  // Drop join records left over from an earlier party so the list doesn't grow
  // across sessions. Anyone whose phone is still open re-joins within seconds.
  try{
    const cutoff = Date.now() - 12 * 60 * 60 * 1000;
    for (const k of await sList('join:')){
      const info = await sGet(k);
      if (!info || (info.requestedAt || 0) < cutoff) await sDel(k);
    }
  } catch(e){ console.error('stale join cleanup failed', e); }

  hostState = {
    status: 'lobby',
    // Stamped on every answer so leftover answers from an earlier round can never
    // be counted in this one — the host can now return to setup and restart freely.
    roundId: 'r_' + Date.now().toString(36),
    questionIndex: -1,
    timeLimitMs: TIME_LIMIT_SECONDS * 1000,
    questions: buildPlayList(),
    players: {},
    currentAnswers: {},
    shouxingId: null,
    prizes: PRIZES.slice(),
    wishCards: ['', '', ''],
    wishCardsUpdatedAt: 0,
    awardsStage: null,
    topIds: [],
    bottomIds: [],
    pickOrder: [],
    pickedCards: {}
  };
  await sSet('game:state', hostState);
  renderHostLobby();
  startHostPolling();
}
function renderHostLobby(){
  const url = joinUrl();
  dropMissingShouxing(hostState);
  const players = Object.entries(hostState.players);
  const total = hostState.questions.length;
  const sxReady = !!(hostState.shouxingId && hostState.players[hostState.shouxingId]);
  render(`
    <div class="shell"><div class="col" style="align-items:center;text-align:center">
      ${hostNav(true)}
      <span class="eyebrow">📶 等待加入</span>
      <h1 class="marquee-title" style="font-size:clamp(28px,5vw,48px)">掃碼<span class="hl">加入猜猜</span></h1>
      <div class="qr-card">${qrSvgHtml(url, '')}</div>
      <div class="join-url">${esc(url)}</div>
      <p class="sub" style="font-size:13px;margin-top:-4px">本場共 ${total} 題${RANDOM_ORDER?'．順序已隨機':''}${RANDOM_OPTIONS?'．選項已隨機':''}</p>

      <div style="margin-top:6px;width:100%">
        <div class="chip" style="margin:0 auto 10px;width:fit-content">
          <span>👥 已加入</span><span class="num">${players.length}</span><span>人</span>
        </div>
        <div class="players-grid">
          ${players.length ? players.map(([id,p])=>`
            <button class="player-pill ${id===hostState.shouxingId?'is-shouxing':''}" onclick="setShouxing('${id}')">
              <span class="dot"></span>${avatarSpan(p.avatar)}${esc(p.name)}${id===hostState.shouxingId? '<span class=\"badge-shouxing\">🎂 壽星</span>' : ''}
            </button>
          `).join('') : '<p class="sub">還沒有人加入，請大家掃上面的 QR code</p>'}
        </div>
        <p class="sub" style="margin-top:8px">${sxReady? '點其他人的名字可以改指定壽星' : '壽星還沒加入，或請確認她是用你私下傳給她的專屬連結加入的（也可以直接點名字手動指定）'}</p>
      </div>

      <div class="btn-row" style="margin-top:8px">
        <button class="btn secondary" onclick="backToSetupFromLobby()">← 回設定</button>
        <button class="btn ghost" onclick="clearAllPlayers()">🧹 清空名單</button>
        <button class="btn" onclick="nextQuestion()" ${sxReady? '' : 'disabled'}>▶ 開始第一題</button>
      </div>
    </div></div>
  `);
}
/* Nobody has answered anything yet in the lobby, so no confirm is needed here.
   Note we do NOT copy hostState.questions back into QUESTIONS — that list may be a
   shuffled or randomly drawn subset, and overwriting the master list would slowly
   eat the host's real question set. */
async function backToSetupFromLobby(){
  stopHostTimers();
  await parkGame();
  renderHostSetup();
}
function setShouxing(id){
  hostState.shouxingId = id;
  sSet('game:state', hostState);
  renderHostLobby();
}

/* ============================================================
   HOST: polling for joins / answers
   ============================================================ */
function startHostPolling(){
  if (hostPollHandle) clearInterval(hostPollHandle);
  hostPollHandle = setInterval(hostPollTick, 1800);
}
async function hostPollTick(){
  if (!hostState || pollBusy) return;
  pollBusy = true;
  try{
    if (['lobby','question','reveal'].includes(hostState.status)) await processJoins();
    if (hostState.status === 'question') await processAnswers();
    if (['lobby','question','reveal','final'].includes(hostState.status)) await processStarCards();
    if (hostState.status === 'awards' && hostState.awardsStage === 'picking') await processCardPicks();
  } finally { pollBusy = false; }
}
/* The 壽星 writes her 3 wish cards to her own storage key from her phone; pick it
   up here and fold it into the authoritative state, same pattern as processJoins(). */
async function processStarCards(){
  const sx = hostState.shouxingId;
  if (!sx) return;
  const info = await sGet('starcards:' + sx);
  if (!info || !Array.isArray(info.text)) return;
  if ((info.updatedAt || 0) === (hostState.wishCardsUpdatedAt || 0)) return;
  hostState.wishCards = [info.text[0]||'', info.text[1]||'', info.text[2]||''];
  hostState.wishCardsUpdatedAt = info.updatedAt || 0;
  await sSet('game:state', hostState);
}
async function processJoins(){
  const keys = await sList('join:');
  let changed = false;
  for (const k of keys){
    const id = k.slice('join:'.length);
    const info = await sGet(k);
    if (!info) continue;
    const token = info.requestedAt || 0;
    const existing = hostState.players[id];
    if (existing && existing.joinToken === token) continue;   // nothing new from this phone

    if (existing){
      // Same phone coming back (reload, lost signal, renamed) — keep their score & history.
      existing.name = info.name;
      existing.avatar = info.avatar || existing.avatar || '⭐';
      existing.joinToken = token;
    } else {
      hostState.players[id] = { name: info.name, avatar: info.avatar || '⭐', score: 0, joinToken: token, history: [] };
    }
    // Anyone arriving through the private 壽星 link claims the badge, even if
    // someone else (or their own earlier ghost) is holding it.
    if (info.isShouxing) hostState.shouxingId = id;
    changed = true;
  }
  if (dropMissingShouxing(hostState)) changed = true;
  if (changed){
    await sSet('game:state', hostState);
    if (hostState.status === 'lobby') renderHostLobby();
  }
}
/* Wipe the player list. Phones that are still open re-join within a couple of
   seconds; ghosts from closed tabs and crashed sessions stay gone. */
async function clearAllPlayers(){
  const ok = await uiConfirm('清空所有玩家？',
    '目前的名單和分數會全部清掉。還開著頁面的人幾秒內會自動重新加入，關掉頁面的「幽靈玩家」就不會回來了。',
    '清空名單', true);
  if (!ok) return;
  const keys = (await sList('join:')).concat(await sList('answer:'));
  for (const k of keys) await sDel(k);
  hostState.players = {};
  hostState.currentAnswers = {};
  // Nobody is on the list now, so no one can hold the badge. Whoever comes back
  // through the 壽星 link reclaims it automatically a second later.
  hostState.shouxingId = null;
  await sSet('game:state', hostState);
  renderHostLobby();
  toast('已清空，還在線上的人會自動回來');
}
async function processAnswers(){
  const keys = await sList('answer:');
  let changed = false;
  for (const k of keys){
    const id = k.slice('answer:'.length);
    if (!hostState.players[id]) continue;
    if (hostState.currentAnswers[id]) continue;
    const ans = await sGet(k);
    if (!ans) continue;
    if (ans.roundId !== hostState.roundId) continue;
    if (ans.questionIndex !== hostState.questionIndex) continue;
    hostState.currentAnswers[id] = { choice: ans.choice, elapsedMs: ans.elapsedMs };
    changed = true;
  }
  if (changed){
    await sSet('game:state', hostState);
    renderHostQuestion();
  }
}

/* ============================================================
   HOST: QUESTION
   ============================================================ */
function nextQuestion(){
  hostState.questionIndex += 1;
  if (hostState.questionIndex >= hostState.questions.length){ return goFinal(); }
  hostState.status = 'question';
  hostState.currentAnswers = {};
  hostQuestionStartLocal = Date.now();
  sSet('game:state', hostState);
  renderHostQuestion();
  if (hostCountdownHandle) clearInterval(hostCountdownHandle);
  hostCountdownHandle = setInterval(hostCountdownTick, 200);
}
function hostCountdownTick(){
  const remainMs = hostState.timeLimitMs - (Date.now() - hostQuestionStartLocal);
  if (remainMs <= 0){ clearInterval(hostCountdownHandle); goToReveal(); return; }
  updateHostTimerUI(remainMs);
}
function updateHostTimerUI(remainMs){
  const chip = document.getElementById('host-timer-chip');
  const bar = document.getElementById('host-answer-bar');
  if (chip){
    const secs = Math.ceil(remainMs/1000);
    chip.querySelector('.num').textContent = secs;
    chip.classList.toggle('urgent', secs <= 5);
  }
  if (bar){
    const answered = Object.keys(hostState.currentAnswers).length;
    const total = Object.keys(hostState.players).length || 1;
    bar.style.width = Math.min(100, Math.round(answered/total*100)) + '%';
    const lbl = document.getElementById('host-answer-label');
    if (lbl) lbl.textContent = '已作答 ' + answered + ' / ' + total;
  }
}
function renderHostQuestion(){
  const q = hostState.questions[hostState.questionIndex];
  const answered = Object.keys(hostState.currentAnswers).length;
  const total = Object.keys(hostState.players).length || 1;
  const pct = Math.min(100, Math.round(answered/total*100));
  const shouxingName = hostState.players[hostState.shouxingId] ? hostState.players[hostState.shouxingId].name : '';
  render(`
    <div class="shell"><div class="col">
      ${hostNav(true)}
      <div class="topbar">
        <div class="chip">第 <span class="num">${hostState.questionIndex+1}</span> / ${hostState.questions.length} 題</div>
        <div class="chip shouxing">🎂 猜猜 ${esc(shouxingName)} 會選什麼</div>
        <div class="chip timer" id="host-timer-chip"><span>⏱</span><span class="num">${Math.ceil(hostState.timeLimitMs/1000)}</span></div>
      </div>
      ${q.headerImg? `<img class="q-header-img" src="${q.headerImg}" alt="">` : ''}
      ${qtextHtml(q.text)}
      <div class="${optionsGridClass(q)}">
        ${q.options.map((o,i)=> optionCardHtml(o, i, null)).join('')}
      </div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="host-answer-bar" style="width:${pct}%"></div></div>
        <div class="progress-label" id="host-answer-label">已作答 ${answered} / ${total}</div>
      </div>
      <div class="btn-row" style="margin-top:6px"><button class="btn secondary" onclick="goToReveal()">提前公布壽星的答案 →</button></div>
    </div></div>
  `);
}

/* ============================================================
   HOST: REVEAL  (correctness = whatever the 壽星 picked)
   ============================================================ */
function goToReveal(){
  if (hostState.status !== 'question') return;
  if (hostCountdownHandle) clearInterval(hostCountdownHandle);
  const q = hostState.questions[hostState.questionIndex];
  for (const id in hostState.players){
    if (!hostState.currentAnswers[id]) hostState.currentAnswers[id] = { choice:null, elapsedMs:null };
  }
  const sx = hostState.shouxingId;
  const shouxingChoice = (sx && hostState.currentAnswers[sx]) ? hostState.currentAnswers[sx].choice : null;
  const shouxingLabel = shouxingChoice!=null && q.options[shouxingChoice] ? q.options[shouxingChoice].label : null;
  for (const id in hostState.currentAnswers){
    if (id === sx) continue;
    const a = hostState.currentAnswers[id];
    const correct = shouxingChoice != null && a.choice === shouxingChoice;
    const elapsed = a.elapsedMs==null ? hostState.timeLimitMs : Math.max(0, Math.min(a.elapsedMs, hostState.timeLimitMs));
    const points = correct ? Math.round(500 + 500 * (1 - elapsed / hostState.timeLimitMs)) : 0;
    a.correct = correct; a.points = points;
    if (!hostState.players[id]) continue;
    hostState.players[id].score += points;
    // Keep a per-question record so the player can review their answers after the game.
    if (!hostState.players[id].history) hostState.players[id].history = [];
    hostState.players[id].history.push({
      q: q.text,
      myLabel: a.choice!=null && q.options[a.choice] ? q.options[a.choice].label : null,
      shouxingLabel: shouxingLabel,
      correct: correct,
      points: points
    });
  }
  hostState.status = 'reveal';
  sSet('game:state', hostState);
  renderHostReveal();
}
function renderHostReveal(){
  const q = hostState.questions[hostState.questionIndex];
  const sx = hostState.shouxingId;
  const shouxingChoice = hostState.currentAnswers[sx] ? hostState.currentAnswers[sx].choice : null;
  const counts = [0,0,0,0];
  Object.values(hostState.currentAnswers).forEach(a=>{ if (a.choice!=null) counts[a.choice]++; });
  // The 壽星 sets the answer rather than guessing it, so they never score —
  // leaving them in the table just parked them at the bottom on 0. They get
  // their own line above the board instead.
  const ranked = rankedGuessers(hostState.players, sx);
  const sxName = hostState.players[sx] ? hostState.players[sx].name : '';
  const isLast = hostState.questionIndex >= hostState.questions.length - 1;

  render(`
    <div class="shell"><div class="col">
      ${hostNav(true)}
      <span class="eyebrow">🎂 壽星的選擇</span>
      ${qtextHtml(q.text, "font-size:clamp(17px,3vw,24px);max-width:30em")}
      ${shouxingChoice==null ? '<p class="sub" style="text-align:center">壽星這題沒來得及作答，這題大家都不計分</p>' : ''}
      <div class="options-grid">
        ${q.options.map((o,i)=> revealRowHtml(o, i, counts[i], i===shouxingChoice)).join('')}
      </div>
      <div class="panel" style="margin-top:8px">
        <h2>🏆 目前排行榜</h2>
        ${sxName? `<p class="sub" style="margin-top:2px">🎂 ${esc(sxName)} 是今天的壽星，負責出正解，不列入排名</p>`:''}
        <div class="stack" style="margin-top:10px">
          ${ranked.map(([id,p],i)=>`
            <div class="lb-row">
              <div class="lb-rank ${i===0?'top1':i===1?'top2':i===2?'top3':''}">${i+1}</div>
              <div class="lb-name">${avatarSpan(p.avatar)}${esc(p.name)}</div>
              ${hostState.currentAnswers[id] && hostState.currentAnswers[id].points>0 ? `<div class="lb-delta">+${hostState.currentAnswers[id].points}</div>` : ''}
              <div class="lb-score num">${p.score}</div>
            </div>
          `).join('') || '<p class="sub">還沒有人猜</p>'}
        </div>
      </div>
      <div class="btn-row" style="margin-top:6px">
        <button class="btn" onclick="${isLast? 'goFinal()' : 'nextQuestion()'}">${isLast? '🏁 查看最終結果 →' : '下一題 →'}</button>
      </div>
    </div></div>
  `);
}

/* ============================================================
   HOST: FINAL

/* Player writes their pick to cardpick:<id>; picked up here on the next host poll. */
async function processCardPicks(){
  const order = hostState.pickOrder || [];
  const picked = hostState.pickedCards || {};
  const nextId = order.find(id => picked[id] === undefined);
  if (!nextId) return;
  const info = await sGet('cardpick:' + nextId);
  if (!info) return;
  if (picked[nextId] !== undefined) return;         // already resolved (race guard)
  if (info.forRound !== hostState.roundId) return;   // stale leftover from an earlier game
  const idx = info.cardIndex;
  const takenIdxs = Object.values(picked);
  if (typeof idx !== 'number' || idx < 0 || idx > 2 || takenIdxs.includes(idx)) return;
  hostState.pickedCards[nextId] = idx;
  await sDel('cardpick:' + nextId);
  if (Object.keys(hostState.pickedCards).length >= order.length) hostState.awardsStage = 'done';
  await sSet('game:state', hostState);
  renderHostAwards();
}
/* Fallback for a phone that's gone quiet mid-ceremony — assign a random remaining card. */
async function hostForcePick(){
  const order = hostState.pickOrder || [];
  const currentId = order.find(id => hostState.pickedCards[id] === undefined);
  if (!currentId) return;
  const takenIdxs = Object.values(hostState.pickedCards);
  const remaining = [0,1,2].filter(i => !takenIdxs.includes(i));
  const idx = remaining[Math.floor(Math.random()*remaining.length)];
  hostState.pickedCards[currentId] = idx;
  await sDel('cardpick:' + currentId);
  if (Object.keys(hostState.pickedCards).length >= order.length) hostState.awardsStage = 'done';
  await sSet('game:state', hostState);
  renderHostAwards();
}

async function playerPollTick(){
  if (pollBusy) return;
  pollBusy = true;
  try{
    const state = await sGet('game:state');
    if (!state){
      // Server restarted and lost everything (a Render wake-up does exactly this).
      // Don't freeze on the old screen — say so, and keep offering ourselves up
      // so we're already on the list when the host opens the next game.
      renderPlayerReconnecting();
      await rejoinIfNeeded();
      return;
    }
    lastPlayerState = state;
    // Host doesn't know us any more (restart, or they cleared the name list) — get back on.
    if (state.players && !state.players[PLAYER_ID] && ['lobby','idle'].includes(state.status)){
      await rejoinIfNeeded();
    }
    // Don't yank the player out of a self-typed screen (wish cards, answer log)
    // just because a poll landed — same bug class as the old time-limit-wipes-form one.
    if (!manualPlayerScreen) renderPlayerView(state);
  } finally { pollBusy = false; }
}

        `).join('')}
      </div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn secondary" onclick="exitManualScreen()">← 返回</button>
        <button class="btn" onclick="saveWishCards()">💾 儲存</button>
      </div>
    </div></div>
  `);
}
async function saveWishCards(){
  await sSet('starcards:' + PLAYER_ID, { text: _wishDraft.slice(), updatedAt: Date.now() });
  toast('許願卡已儲存！');
  exitManualScreen();
}
function renderPlayerQuestionOrWaiting(state){
  const isNew = state.questionIndex !== localSeenQuestionIndex;
  if (isNew){
    localSeenQuestionIndex = state.questionIndex;
    localQuestionSeenAt = Date.now();
    hasAnsweredCurrent = false;
  }
  if (hasAnsweredCurrent){ renderPlayerAnswered(state); return; }
  const q = state.questions[state.questionIndex];
  const isSx = state.shouxingId === PLAYER_ID;
  render(`
    <div class="shell"><div class="col">
      <div class="chip" style="margin:0 auto">第 <span class="num">${state.questionIndex+1}</span> / ${state.questions.length} 題</div>
      <p class="sub" style="text-align:center;font-weight:700">${isSx? '🎂 這題換你決定！大家會猜你的答案' : '🤔 猜猜壽星會選哪一個？'}</p>
      ${q.headerImg? `<img class="q-header-img" src="${q.headerImg}" alt="">` : ''}
      ${qtextHtml(q.text)}
      <div class="${optionsGridClass(q)}">
        ${q.options.map((o,i)=> optionCardHtml(o, i, `onclick="playerAnswer(${i})"`)).join('')}
      </div>
    </div></div>
  `);
}
async function playerAnswer(choiceIdx){
  if (hasAnsweredCurrent) return;
  hasAnsweredCurrent = true;
  const elapsedMs = Date.now() - localQuestionSeenAt;
  await sSet('answer:' + PLAYER_ID, {
    roundId: lastPlayerState ? lastPlayerState.roundId : null,
    questionIndex: localSeenQuestionIndex,
    choice: choiceIdx,
    elapsedMs
  });
  renderPlayerAnswered(lastPlayerState);
}
function renderPlayerAnswered(state){
  const isSx = state && state.shouxingId === PLAYER_ID;
  render(`
    <div class="shell"><div class="center">
      <div style="font-size:54px">${isSx?'🎂':'🚀'}</div>
      <h1 class="marquee-title" style="font-size:clamp(22px,6vw,32px)">已送出答案！</h1>
      <p class="sub">${isSx? '大家要開始猜你的答案囉～' : '等待其他人作答'}<span class="waiting-dots"><span>.</span><span>.</span><span>.</span></span></p>
    </div></div>
  `);
}
function renderPlayerReveal(state){
  const sx = state.shouxingId;
  const mine = state.currentAnswers ? state.currentAnswers[PLAYER_ID] : null;
  const me = state.players[PLAYER_ID];
  const q = state.questions[state.questionIndex];
  const shouxingChoice = state.currentAnswers[sx] ? state.currentAnswers[sx].choice : null;
  const shouxingOpt = shouxingChoice!=null ? q.options[shouxingChoice] : null;

  if (PLAYER_ID === sx){
    const matched = Object.entries(state.currentAnswers).filter(([id,a])=> id!==sx && a.correct).length;
    render(`
      <div class="shell"><div class="center">
        <div style="font-size:54px">🎂</div>
        <h1 class="marquee-title" style="font-size:clamp(22px,6vw,32px)">你選的是「${esc(shouxingOpt? shouxingOpt.label : '')}」</h1>
        <p class="sub">有 <b>${matched}</b> 人猜中你的答案！</p>
      </div></div>
    `);
    return;
  }

  const gotIt = mine && mine.correct;
  render(`
    <div class="shell"><div class="center">
      <div style="font-size:54px">${shouxingChoice==null ? '⌛' : gotIt ? '🎯' : '❌'}</div>
      <h1 class="marquee-title" style="font-size:clamp(22px,7vw,34px);color:${gotIt?'var(--moss)':'var(--ink)'}">
        ${shouxingChoice==null ? '壽星這題沒作答' : gotIt ? '猜對了！' : '猜錯了'}
      </h1>
      ${shouxingOpt ? `
        <p class="sub">壽星選的是：${esc(shouxingOpt.label)}</p>
        ${shouxingOpt.img? `<img src="${shouxingOpt.img}" style="width:140px;height:140px;object-fit:cover;border-radius:16px">`:''}
      ` : ''}
      ${gotIt ? `<div class="chip"><span>+</span><span class="num">${mine.points}</span><span>分</span></div>` : ''}
      <div class="panel" style="margin-top:8px;width:100%;max-width:300px">
        <div class="sub">目前總分</div>
        <div class="num" style="font-size:36px;color:var(--moss)">${me ? me.score : 0}</div>
      </div>
    </div></div>
  `);
}
function renderPlayerFinal(state){
  const sx = state.shouxingId;
  const ranked = rankedGuessers(state.players, sx);
  const sxName = state.players[sx] ? state.players[sx].name : '';
  const myRank = ranked.findIndex(([id])=> id === PLAYER_ID);
  const medal = ['🥇','🥈','🥉'];
  render(`
    <div class="shell"><div class="center">
      ${mascot()}
      <span class="eyebrow">🎊 遊戲結束</span>
      <h1 class="marquee-title" style="font-size:clamp(24px,7vw,38px)">${PLAYER_ID===sx? '🎂 生日快樂！' : (myRank>=0 && myRank<3 ? medal[myRank]+' 你最懂壽星！' : '感謝參加！')}</h1>
      ${PLAYER_ID===sx && sxName? '<p class="sub">下面是大家猜你的成績～</p>' : ''}
      <div class="stack" style="width:100%;max-width:340px;margin-top:6px">
        ${ranked.map(([id,p],i)=>`
          <div class="lb-row ${id===PLAYER_ID?'me':''}">
            <div class="lb-rank ${i===0?'top1':i===1?'top2':i===2?'top3':''}">${i+1}</div>
            <div class="lb-name">${avatarSpan(p.avatar)}${esc(p.name)}</div>
            <div class="lb-score num">${p.score}</div>
          </div>
        `).join('') || '<p class="sub">這場沒有人猜</p>'}
      </div>
      <div class="btn-row" style="margin-top:12px">
        ${PLAYER_ID!==sx ? '<button class="btn secondary" onclick="renderPlayerAnswerLog()">📜 查看我的作答紀錄</button>' : ''}
      </div>
      ${PLAYER_ID===sx ? renderStarWishCardsEntry() : ''}
      <p class="sub" style="font-size:12.5px;margin-top:4px">等主持人開始頒獎典禮，這裡會自動接上</p>
    </div></div>
  `);
}
/* Per-question review of this player's own answers vs. the 壽星's picks.
   A manual screen — see manualPlayerScreen — so the poll loop doesn't yank
   them back to the leaderboard mid-read. */
function renderPlayerAnswerLog(){
  manualPlayerScreen = true;
  const me = lastPlayerState && lastPlayerState.players ? lastPlayerState.players[PLAYER_ID] : null;
  const hist = (me && me.history) || [];
  render(`
    <div class="shell"><div class="col">
      <span class="eyebrow">📜 作答紀錄</span>
      <h1 class="marquee-title" style="font-size:clamp(22px,6vw,34px)">你的<span class="hl">作答紀錄</span></h1>
      <div class="stack">
        ${hist.length ? hist.map((h,i)=>`
          <div class="panel answerlog-row ${h.correct?'ok':'no'}">
            <div class="sub" style="font-weight:700">第 ${i+1} 題</div>
            <div style="font-weight:700;margin:4px 0;white-space:pre-wrap">${esc(h.q)}</div>
            <div class="sub">你選的：${h.myLabel!=null? esc(h.myLabel) : '（沒作答）'}</div>
            <div class="sub">壽星選的：${h.shouxingLabel!=null? esc(h.shouxingLabel) : '（壽星沒作答）'}</div>
            <div style="margin-top:6px">
              ${h.correct? `<span class="lb-delta">🎯 猜對了！+${h.points}</span>` : '<span class="sub">❌ 猜錯了</span>'}
            </div>
          </div>
        `).join('') : '<p class="sub">還沒有作答紀錄</p>'}
      </div>
      <button class="btn secondary" style="margin-top:10px" onclick="exitManualScreen()">← 返回</button>
    </div></div>
  `);
}
/* ---------- PLAYER: 頒獎典禮 ---------- */
function renderPlayerAwards(state){
  const stage = state.awardsStage || 'podium';
  const sx = state.shouxingId;
  const isSx = PLAYER_ID === sx;
  const topIds = state.topIds || [];
  const myTopRank = topIds.indexOf(PLAYER_ID);
  const bottomIds = state.bottomIds || [];
  const amBottom = bottomIds.includes(PLAYER_ID);
  const cards = state.wishCards || ['','',''];
  const medal = ['🥇','🥈','🥉'];

  if (stage === 'podium'){
    render(`
      <div class="shell"><div class="center">
        ${mascot()}
        <div style="font-size:54px">${myTopRank>=0 ? medal[myTopRank] : '🎉'}</div>
        <h1 class="marquee-title" style="font-size:clamp(24px,7vw,38px)">${myTopRank>=0? '恭喜上台領獎！' : '頒獎典禮進行中'}</h1>
        <p class="sub">看主畫面揭曉最懂壽星的前三名～</p>
        ${isSx ? renderStarWishCardsEntry() : ''}
      </div></div>
    `);
    return;
  }
  if (stage === 'rps'){
    render(`
      <div class="shell"><div class="center">
        <div style="font-size:54px">✊✋✌️</div>
        <h1 class="marquee-title" style="font-size:clamp(22px,6vw,32px)">${amBottom? '猜拳決定選卡順序！' : '猜拳決定順序中'}</h1>
        <p class="sub">${amBottom? '看主畫面，輪到你就會通知你' : '請看主畫面'}</p>
      </div></div>
    `);
    return;
  }
  if (stage === 'picking'){
    const order = state.pickOrder || [];
    const picked = state.pickedCards || {};
    const pickedIdxs = Object.values(picked);
    const currentId = order.find(id => picked[id] === undefined);
    if (currentId === PLAYER_ID){
      render(`
        <div class="shell"><div class="center">
          <div style="font-size:54px">🎁</div>
          <h1 class="marquee-title" style="font-size:clamp(22px,6vw,32px)">選一張許願卡！</h1>
          <p class="sub">選到的內容就是你要完成的任務</p>
          <div class="stack" style="width:100%;max-width:340px">
            ${[0,1,2].map(i=> pickedIdxs.includes(i) ? '' : `
              <button class="opt-card ${OPT_CLASS[i]}" style="text-align:center;justify-content:center" onclick="pickWishCard(${i})">${esc(cards[i] || ('神秘任務 ' + (i+1)))}</button>
            `).join('')}
          </div>
        </div></div>
      `);
    } else {
      const p = currentId ? state.players[currentId] : null;
      render(`
        <div class="shell"><div class="center">
          <div style="font-size:54px">🃏</div>
          <h1 class="marquee-title" style="font-size:clamp(22px,6vw,32px)">${p? esc(p.name)+' 選卡中…' : '選卡中'}</h1>
          <p class="sub">看主畫面囉～</p>
        </div></div>
      `);
    }
    return;
  }
  // stage === 'done'
  const myIdx = (state.pickedCards||{})[PLAYER_ID];
  render(`
    <div class="shell"><div class="center">
      ${mascot()}
      <span class="eyebrow">🎊 頒獎結束</span>
      <h1 class="marquee-title" style="font-size:clamp(24px,7vw,38px)">${myTopRank>=0? medal[myTopRank]+' 你最懂壽星！' : (myIdx!=null ? '你的任務來了！' : '謝謝參加！')}</h1>
      ${myIdx!=null ? `<div class="panel" style="margin-top:8px;max-width:340px"><div class="sub">你抽到的許願任務</div><div style="font-weight:800;margin-top:6px">${esc(cards[myIdx]||'—')}</div></div>` : ''}
      ${PLAYER_ID!==sx ? '<button class="btn secondary" style="margin-top:12px" onclick="renderPlayerAnswerLog()">📜 查看我的作答紀錄</button>' : ''}
    </div></div>
  `);
}
async function pickWishCard(i){
  await sSet('cardpick:' + PLAYER_ID, { cardIndex: i, forRound: lastPlayerState ? lastPlayerState.roundId : null });
  render(`
    <div class="shell"><div class="center">
      <div style="font-size:54px">✅</div>
      <h1 class="marquee-title" style="font-size:clamp(22px,6vw,32px)">已送出！</h1>
      <p class="sub">看主畫面公布結果</p>
    </div></div>
  `);
}

boot();
</script>
</body>
</html>
